<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Heft</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #F4F1EA; overflow: hidden; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block;
        background: #F4F1EA; touch-action: none; outline: none; }
      #loading { position: fixed; left: 0; right: 0; top: 40%; text-align: center;
        font: 600 20px sans-serif; color: #232B38; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Loading Heft&hellip;</div>
    <script src="Build/web.loader.js"></script>
    <script>
      var loading = document.getElementById("loading");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/web.data.unityweb",
        frameworkUrl: "Build/web.framework.js.unityweb",
        codeUrl: "Build/web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Heft",
        productVersion: "1.0",
      }, function (progress) {
        loading.textContent = "Loading Heft… " + Math.round(progress * 100) + "%";
      }).then(function () {
        loading.style.display = "none";
      }).catch(function (message) {
        loading.textContent = "Heft could not start: " + message;
      });
    </script>
  </body>
</html>
